services:
  languagebridge:
    build: .
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - languagebridge-data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.yaml
    # Optional: uncomment to add a local Ollama for free on-device translation
    # depends_on:
    #   - ollama

  # --- Optional: mautrix-whatsapp bridge ---
  # Uncomment to bridge your WhatsApp account into Matrix.
  # Full setup guide: https://docs.mau.fi/bridges/go/whatsapp/index.html
  #
  # whatsapp:
  #   image: dock.mau.fi/mautrix/whatsapp:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./whatsapp-data:/data

  # --- Optional: local Ollama (free, private, no API key) ---
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  languagebridge-data:
  # ollama-data:
