services:
  languagebridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - languagebridge-data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - LB_MATRIX_PASSWORD=${LB_MATRIX_PASSWORD:-}
    # Optional: uncomment to add a local Ollama for free on-device translation
    # depends_on:
    #   - ollama

  # One-shot init: ensure /app/data is writable by appuser (uid/gid 1000)
  languagebridge-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles:
      - init
    user: root
    volumes:
      - languagebridge-data:/app/data
    entrypoint: ["sh", "-lc", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]

  # Local dev: DEBUG logging, config-local.yaml, ./data on host (E2EE DB + sqlite persist like `make run-local`)
  languagebridge-local:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles:
      - local
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      LOG_LEVEL: DEBUG
      CONFIG_PATH: /app/config/config-local.yaml
      LB_MATRIX_PASSWORD: ${LB_MATRIX_PASSWORD:-}

  # Run tests: `make docker-test` or `docker compose --profile test run --rm languagebridge-test`
  languagebridge-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles:
      - test

  # Optional: mautrix-whatsapp bridge ---
  # Full setup guide: https://docs.mau.fi/bridges/go/whatsapp/index.html
  whatsapp:
    image: dock.mau.fi/mautrix/whatsapp:latest
    restart: unless-stopped
    profiles:
      - whatsapp
    volumes:
      - ./whatsapp-data:/data

  # --- Optional: local Ollama (free, private, no API key) ---
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  languagebridge-data:
  # ollama-data:
