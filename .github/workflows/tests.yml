name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run tests in Docker
        run: make test

      - name: Cleanup containers
        if: always()
        run: docker compose down --remove-orphans
