name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run tests in Docker
        run: make test

      - name: Cleanup containers
        if: always()
        run: docker compose down --remove-orphans

  deploy-vultr:
    runs-on: ubuntu-latest
    needs: docker-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: ${{ secrets.VULTR_PORT || '22' }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            trap 'echo "[ERROR] Deploy failed at line $LINENO: $BASH_COMMAND"' ERR
            export PS4='+ [${LINENO}] '
            set -x

            log() { echo; echo "==== $* ===="; }
            APP_PATH="${{ secrets.VULTR_APP_PATH }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            log "Host context"
            whoami
            hostname
            pwd

            log "Prepare repository path"
            mkdir -p "$(dirname "$APP_PATH")"
            if [ -d "$APP_PATH" ] && [ ! -d "$APP_PATH/.git" ]; then
              echo "[ERROR] $APP_PATH exists but is not a git repository."
              echo "Fix path or remove the directory manually before rerunning deploy."
              exit 1
            fi
            if [ ! -d "$APP_PATH/.git" ]; then
              log "Cloning repository"
              git clone "$REPO_URL" "$APP_PATH"
            fi

            log "Validate server config"
            cd "$APP_PATH"
            test -f config/config.yaml || {
              echo "Missing config/config.yaml on server at $PWD"
              echo "Create it from config/config.example.yaml and add secrets."
              exit 1
            }

            if ! command -v docker >/dev/null 2>&1; then
              log "Installing Docker Engine + Compose plugin"
              apt-get update
              apt-get install -y ca-certificates curl gnupg
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              chmod a+r /etc/apt/keyrings/docker.gpg
              . /etc/os-release
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $VERSION_CODENAME stable" | tee /etc/apt/sources.list.d/docker.list >/dev/null
              apt-get update
              apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            log "Deploy application"
            docker --version
            docker compose version
            git pull --ff-only
            docker compose build --progress plain languagebridge
            docker compose up -d --no-deps languagebridge
            docker compose ps
