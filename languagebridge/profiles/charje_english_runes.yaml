prompt_appendix: |
  ## Charje English phonetic runes (input decoding)

  Decode Charje English runic text into natural modern English.
  The user-facing output must be plain English in Latin script.

  Primary reference: http://charje.net/phonetic-table-of-english.html
  The list below matches that table’s phoneme/rune/example pairs. Alternates
  ᚠ̣, ᚦ̣, ᚴ, and ᚴᚳ follow the site’s fricative rows; ᚷ vs ᛡ follows note 4 on the site.

  ### Main table (order and examples as on the site)

  - b — ᛒ — Birch — ᛒᛟᚱᚳ
  - d — ᛞ — Day — ᛞᛖᚷ
  - g (as in gift) — ᚸ — Gift — ᚸᛁᚠᛏ
  - long “ee” (i + glide column “iy”) — ᛁᚷ — Even — ᛁᚷᚠ̣ᛟᚾ
  - “oo” — ᚢ — Ooze — ᚢᚴ
  - ɔɪ / oy — ᚩᚷ — Oink — ᚩᚷᛝᛣ
  - p — ᛈ — Pear — ᛈᛖᚱ
  - t — ᛏ — Tear — ᛏᛁᚷᚱ
  - k — ᛣ — Key — ᛣᛁᚷ
  - ʤ (as in jump); Latin j in that row — ᚳᚷ — Jump — ᚳᚷᛟᛗᛈ
  - ɪ / short i — ᛁ — Inn — ᛁᚾ
  - ʊ / ü — ᚣ — Hood — ᚻᚣᛞ
  - eɪ / ey — ᛖᚷ — Eight — ᛖᚷᛏ
  - m — ᛗ — Man — ᛗᚫᚾ
  - n — ᚾ — Need — ᚾᛁᚷᛞ
  - ŋ — ᛝ — King — ᛣᛁᛝ
  - ʧ / c — ᚳ — Choose — ᚳᚢᚴ
  - ɛ / e — ᛖ — End — ᛖᚾᛞ
  - ə, ʌ / ë — ᛟ — Abode — ᛟᛒᚩᛞ
  - aɪ / äy — ᚫᚷ — Eye — ᚫᚷ
  - f, v — ᚠ (fricative alternate ᚠ̣ on the site) — Fee — ᚠᛁᚷ
  - θ, ð / þ — ᚦ (fricative alternate ᚦ̣ on the site) — Thorn — ᚦᚩᚱᚾ
  - s, z — ᛋ (alternate ᚴ on the site) — Sun — ᛋᛟᚾ
  - h (and scribal ꜧ in that cell on the site) — ᚻ — Hail Yew — ᚻᛖᚷᛚ᛫ᛡᚢ
    (᛫ = U+16EB runic single punctuation, as between words on the page)
  - velar fricative (rare in English) — ᛇ — (no example word on the site; see note 5)
  - ʃ, ʒ; Latin sc — ᛋᚳ (alternate digraph ᚴᚳ on the site) — Sheep — ᛋᚳᛁᚷᛈ
  - æ / ä — ᚫ — Ash — ᚫᛋᚳ
  - ɑ / a — ᚪ — Odd — ᚪᛞ
  - oʊ / o — ᚩ — Oath — ᚩᚦ
  - w — ᚹ — Win — ᚹᛁᚾ
  - l — ᛚ — Lake — ᛚᛖᚷᛣ
  - ɹ / r — ᚱ — Ride — ᚱᚫᚷᛞ
  - glide y: site row shows ᚷ (context) / j / Latin y / ᛡ — Year — ᛡᛁᚷᚱ
    (use ᚷ only where note 4 requires; otherwise ᛡ for this sound)

  ### Rhotic series

  - iɹ / iyr — ᛁᚷᚱ — Seer — ᛋᛁᚷᚱ
  - ɪɹ / ir — ᛁᚱ — Ear — ᛁᚱ
  - ɛɹ / er — ᛖᚱ — Air — ᛖᚱ
  - uɹ / ur — ᚢᚱ — Poor — ᛈᚢᚱ
  - ʊɹ / ür — ᚣᚱ — Tour — ᛏᚣᚱ
  - ɝ, ʌɹ / ër — ᛟᚱ — Earth — ᛟᚱᚦ
  - æɹ / är — ᚫᚱ — Arrow — ᚫᚱᚩ
  - ɑɹ / ar — ᚪᚱ — Art — ᚪᚱᛏ
  - ɔɹ / or — ᚩᚱ — Oar — ᚩᚱ

  ### Notes (from the site)

  1. Accent variation; for rhotic series trust the named sound over IPA. Site examples: “year” ᛡᛁᚷᚱ, “poor” ᛈᚩᚱ, “Autumn” ᚪᛏᛗ. Non-rhotic simplifications on the site include: ᛋᛁᚷᛟ, ᛁᚷᛟ, ᛖᛟ, ᛈᚪᚢ, ᛏᚪᚢ, ᛟᚱᚦ, ᚫᚱᚩ, ᚪᛏ, ᚪᚢ.
  2. After ᛟ, syllabic ᛗ ᚾ ᛝ ᛚ ᚱ: ᛟ may drop if pronunciation is unchanged and no doubled runes.
  3. Fricative alternates disambiguate, e.g. “visions” ᚠ̣ᛁᚴᚳᚾᚴ (exact string on the site).
  4. ᚷ after ᚳ, ᛁ, ᚩ, ᛖ, ᚫ; ᛡ elsewhere for that glide.
  5. ᛇ is rare in native English; use for loans/dialects.

