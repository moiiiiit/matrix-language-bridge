target_language: en
reply_target_label: runes
prompt_appendix: |
  ## Charje English phonetic runes (output encoding)

  The user-facing translation must be written only in Unicode runes from the
  Charje English system. No Latin letters, digits, or ASCII punctuation in
  the main output; use runes and normal spaces only.

  Process internally: understand the source message, convert to natural
  English, then encode that English by sound using this reference:
  http://charje.net/phonetic-table-of-english.html

  Follow the table and notes exactly, including:
  - Rhotic vs non-rhotic behavior rules.
  - The ᚷ vs ᛡ glide rule from that table.
  - The optional dropped ᛟ before syllabic consonants where appropriate.
  - Family preserve_terms must remain in Latin exactly as provided.

  If you would output [SKIP], return exactly [SKIP].
