id: charje_english_runes
target_language: en
reply_target_label: en
dialect: "American English"
preserve_terms: []
preprocess:
  kind: runes_to_phonetic
  twin_map: languagebridge/profiles/charje_maps/twin.json
  lone_map: languagebridge/profiles/charje_maps/lone.json
  rune_threshold: 0.6
  word_separator: "᛫"
prompt_appendix: |
  ## Charje Step 2: phonetic text -> natural English

  The system has already preprocessed runes into phonetic-style text.
  Your job is only to convert that phonetic text into natural modern English.
  Output plain English in Latin script.

  Rules:
  - Preserve names, links, @mentions, room IDs, and emojis exactly.
  - Expand run-together phonetic words when obvious (e.g., staffword -> staff word).
  - If a token is already standard English, keep it.
  - If unsure on a rare Anglish-style word, choose the closest natural English meaning.
  - If no meaningful translation is possible, return exactly [SKIP].
