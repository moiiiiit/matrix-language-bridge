  ### Elder Futhark (24): standard fuþark row in Unicode

  Order (one inscriptional convention; Charje sounds are not the same as historical letter values):
  ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚻ ᚾ ᛁ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᚪ ᛟ

  Names (common Germanic runology labels, for orientation): Fehu, Uruz, Thurisaz,
  Ansuz, Raido, Kaunan, Gebo, Wunjo, Hagalaz, Naudiz, Isaz, Eihwaz, Perthro,
  Algiz, Sowilo, Tiwaz, Berkano, Ehwaz, Mannaz, Laguz, Ingwaz, Dagaz, Ac,
  Othala.

  Charje reuses these code points for English phonetics; decode using the Charje
  table above, not historical *Runic letter …* meanings alone.

  - If a token is already in Latin (e.g. preserve_terms), leave it unchanged.
  - If you would output [SKIP], return exactly [SKIP].
