prompt_appendix: |
  ## Charje English phonetic runes (input decoding)

  Decode Charje English runic text into natural modern English.
  The user-facing output must be plain English in Latin script.

  Use this reference for rune-to-sound mapping and edge rules:
  http://charje.net/phonetic-table-of-english.html

  Follow the table and notes exactly, including:
  - Rhotic vs non-rhotic behavior rules.
  - The ᚷ vs ᛡ glide rule from that table.
  - The optional dropped ᛟ before syllabic consonants where appropriate.
  - If a token is already in Latin (for example preserve_terms), keep it unchanged.

  If you would output [SKIP], return exactly [SKIP].
