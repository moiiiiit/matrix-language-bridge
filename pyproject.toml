[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "languagebridge"
version = "0.1.0"
description = "Matrix translation bot for multilingual family group chats"
license = "MIT"
authors = ["LanguageBridge Contributors"]
readme = "README.md"
packages = [{ include = "languagebridge" }]

[tool.poetry.dependencies]
python = "^3.12"
mautrix = ">=0.20.0"
lingua-language-detector = ">=2.0.0"
aiosqlite = ">=0.20.0"
aiohttp = ">=3.9.0"
pyyaml = ">=6.0"
pydantic = ">=2.0"

[tool.poetry.scripts]
languagebridge = "languagebridge.main:run"
