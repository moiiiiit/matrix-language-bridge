[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "languagebridge"
version = "0.1.0"
description = "Matrix translation bot for multilingual family group chats"
license = "MIT"
authors = ["LanguageBridge Contributors"]
readme = "README.md"
packages = [{ include = "languagebridge" }]
include = ["languagebridge/profiles/*.yaml"]

[tool.poetry.dependencies]
python = "^3.12"
mautrix = ">=0.20.0"
lingua-language-detector = ">=2.0.0"
aiosqlite = ">=0.20.0"
aiohttp = ">=3.9.0"
pyyaml = ">=6.0"
pydantic = ">=2.0"
python-olm = { version = ">=3.1.0", optional = true }
pycryptodome = { version = ">=3.20.0", optional = true }
# mautrix optional "encryption" extra deps (not pulled in automatically with python-olm alone)
unpaddedbase64 = { version = ">=2.1.0", optional = true }
base58 = { version = ">=2.1.0", optional = true }
# Required so mautrix exposes PgCryptoStore (used with SQLite via mautrix.util.async_db.Database)
asyncpg = { version = ">=0.29.0", optional = true }

[tool.poetry.extras]
e2ee = ["python-olm", "pycryptodome", "unpaddedbase64", "base58", "asyncpg"]

[tool.poetry.scripts]
languagebridge = "languagebridge.main:run"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
